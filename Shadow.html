
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Shadow</title>

  <style>
    body {
      background-color: #eeeeee;
    }

    .my-div {
      width: 250px;
      height: 150px;

      border-radius: 15px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

  <div class="my-div">
    <h2>My Shadow</h2>
  </div>

</body>
</html>
